name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos push seguidos, se cancela el build viejo
concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gam-shinahota-${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
            ${{ steps.imagen.outputs.nombre }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
