# Nginx del VPS: /etc/nginx/sites-available/gamshinahota.rusoft.dev
# Activar:  ln -s /etc/nginx/sites-available/gamshinahota.rusoft.dev /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d gamshinahota.rusoft.dev
server {
    listen 80;
    server_name gamshinahota.rusoft.dev;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
